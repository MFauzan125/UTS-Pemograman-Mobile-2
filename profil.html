<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Galeri Karya</title>
    <link rel="stylesheet" href="profil.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="profile-page">

    <header class="profile-hero">
        <nav class="profile-nav">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
            <i class="fa-solid fa-share-nodes"></i>
        </nav>

        <div class="user-info-wrapper">
            <div class="profile-avatar-large">
                <img src="Gua.jpg" alt="Foto Profil">
                <div class="status-online"></div>
            </div>
            <h1>Maya Anggraeni <i class="fa-solid fa-circle-check verify-icon"></i></h1>
            <p class="handle">@maya_art88</p>
        </div>
    </header>

    <main class="profile-content">
        <div class="stats-card">
            <div class="stat-box">
                <span class="number">42</span>
                <span class="label">Karya</span>
            </div>
            <div class="divider"></div>
            <div class="stat-box">
                <span class="number">12.8K</span>
                <span class="label">Dilihat</span>
            </div>
            <div class="divider"></div>
            <div class="stat-box">
                <span class="number">2.1K</span>
                <span class="label">Disukai</span>
            </div>
        </div>

        <div class="bio-section">
            <h3>Tentang Seniman</h3>
            <p>Eksplorasi warna melalui sapuan kuas digital dan cat air. Terinspirasi oleh lanskap tersembunyi di Indonesia. 🌿✨</p>
            <div class="action-buttons">
                <button class="btn-main">Ikuti</button>
                <button class="btn-outline"><i class="fa-regular fa-envelope"></i></button>
            </div>
        </div>

        <div class="gallery-tabs">
            <span class="tab active">Karya Saya</span>
        </div>

        <div class="artwork-grid">
            <div class="art-item"><img src="https://picsum.photos/400/400?art=1"></div>
            <div class="art-item"><img src="https://picsum.photos/400/600?art=2"></div>
            <div class="art-item"><img src="https://picsum.photos/400/300?art=3"></div>
            <div class="art-item"><img src="https://picsum.photos/400/400?art=4"></div>
        </div>
    </main>
    <footer class="bottom-nav">
        <div class="nav-item active">🏠<br>BERANDA</div>
        <div class="nav-item">🔍<br>JELAJAH</div>
        <div class="nav-item">❤️<br>KOLEKSI</div>
        <div class="nav-item">ℹ️<br>TENTANG</div>
        <div class="nav-item">👤<br>PROFIL</div>
    </footer>

</body>
</html>
